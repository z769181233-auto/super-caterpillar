name: security-scan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.1
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm audit
        run: pnpm audit --prod || true

  osv-scan:
    name: osv-scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.3
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        ./
